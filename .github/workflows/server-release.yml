# Builds DeskPilot Server installers for every OS and attaches them to a GitHub Release.
# Trigger: push a tag like  server-v1.0.0   (or run it manually from the Actions tab).
name: Server installers

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows x64,              artifact: windows-x64 }
          - { os: macos-14,       name: macOS Apple Silicon,       artifact: macos-arm64 }
          - { os: macos-13,       name: macOS Intel,               artifact: macos-x64   }
          - { os: ubuntu-22.04,   name: Linux x64,                 artifact: linux-x64   }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: python -m pip install --upgrade pip
      - run: pip install -r packaging/requirements-build.txt
      - name: Self-test (protocol)
        run: python tests/test_protocol.py
      - name: Build installer
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: deskpilot-server-${{ matrix.artifact }}
          path: server/dist/release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: DeskPilot Server ${{ github.ref_name }}
          body: |
            **Download for your computer**
            - Windows 10/11: `DeskPilotServer-Setup-Windows-x64.exe` (or the portable zip)
            - Mac with Apple chip (M1–M4): `DeskPilotServer-macOS-AppleSilicon.dmg`
            - Mac with Intel chip: `DeskPilotServer-macOS-Intel.dmg`
            - Ubuntu / Debian / Mint: `deskpilot-server-linux-x64.deb`
